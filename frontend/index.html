<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a569e">
  <meta name="description" content="Zapisy na wydarzenia Toruńskiego Centrum Usług Społecznych">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TCUS Wydarzenia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="logo">
      <div>
        <h1>TCUS Wydarzenia</h1>
        <p>Toruńskie Centrum Usług Społecznych</p>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="wydarzenia">Wydarzenia</button>
      <button class="nav-btn" data-view="moje-zapisy">Moje zapisy</button>
      <button class="nav-btn" data-view="info">Informacje</button>
    </nav>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <div id="toast" class="toast hidden" role="status"></div>

  <footer class="footer">
    <p>Toruńskie Centrum Usług Społecznych · ul. Konopnickiej 13/1 · tel. 56 611 89 40</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
